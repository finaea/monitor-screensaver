# Builds the Windows release, publishes it, and attaches everything a downloader needs to
# decide whether to trust it: a SHA-256, a GitHub build-provenance attestation tying the
# .exe to this repo and this commit, and a VirusTotal analysis link.
#
# None of this removes the SmartScreen warning — that needs a signing certificate, and an
# unsigned build starts from zero reputation on every release. What it does buy is a way
# for a sceptical user to prove the binary came out of the public source rather than off a
# maintainer's desktop.
#
# Trigger:  git push origin v1.2.0      (or run it by hand against an existing tag)
#
# Optional secret:
#   VT_API_KEY  — a free VirusTotal API key. Absent, the scan step is skipped and the
#                 release ships without the analysis link; nothing else changes.
#
# macOS is deliberately not here. tools/make-dmg.sh drives Finder over AppleScript to write
# the disk image layout, which needs a real GUI session and automation consent that a
# hosted runner does not have. The .dmg stays a manual build until that is reworked.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v1.2.0)'
        required: true

permissions:
  contents: write           # create the release and upload its assets
  id-token: write           # mint the Sigstore OIDC token the attestation is signed with
  attestations: write       # record the attestation against the repo
  artifact-metadata: write

jobs:
  release:
    runs-on: windows-latest

    env:
      # Read in a step-level `if:` below. A repo without the secret set gets an empty
      # string here and skips the scan rather than failing the release.
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      # Normalises embedded paths in the build output. Free determinism, and it costs
      # nothing locally because it is only ever set here.
      ContinuousIntegrationBuild: true

    steps:
      - name: Resolve tag
        id: tag
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.tag }}'
          } else {
            '${{ github.ref_name }}'
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+') {
            throw "Tag '$tag' is not of the form vMAJOR.MINOR.PATCH."
          }
          "tag=$tag"                     >> $env:GITHUB_OUTPUT
          "version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      # The tag, the csproj and the manifest each carry the version independently and
      # nothing in the build reconciles them — that is how the manifest sat at 1.0.0.0
      # while the csproj had moved to 1.2.0. Fail here rather than ship the mismatch.
      - name: Check the version is consistent
        shell: pwsh
        run: |
          $expected = '${{ steps.tag.outputs.version }}'

          $csproj = [xml](Get-Content 'src/MonitorScreenSaver.Windows/MonitorScreenSaver.Windows.csproj')
          $csprojVersion = $csproj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1

          $manifest = [xml](Get-Content 'src/MonitorScreenSaver.Windows/app.manifest')
          $manifestVersion = $manifest.assembly.assemblyIdentity.version

          # assemblyIdentity wants four parts; <Version> carries three.
          $parts = @($expected -split '\.')
          while ($parts.Count -lt 4) { $parts += '0' }
          $expectedManifest = ($parts[0..3]) -join '.'

          $problems = @()
          if ($csprojVersion -ne $expected) {
            $problems += "csproj <Version> is '$csprojVersion', tag says '$expected'"
          }
          if ($manifestVersion -ne $expectedManifest) {
            $problems += "app.manifest assemblyIdentity is '$manifestVersion', expected '$expectedManifest'"
          }
          if ($problems.Count -gt 0) {
            throw ("Version mismatch:`n  - " + ($problems -join "`n  - "))
          }

          Write-Host "Version $expected agrees across tag, csproj and manifest."

      - name: Build
        shell: pwsh
        run: .\tools\publish.ps1

      # Cheap guard against publishing a stale binary: publish.ps1 does not clean its
      # output directory, so an older exe left in place would otherwise sail through.
      - name: Check the built exe
        id: build
        shell: pwsh
        run: |
          $exe = 'publish/MonitorScreenSaver.exe'
          if (-not (Test-Path $exe)) { throw "$exe was not produced." }

          $item = Get-Item $exe
          $stamped = $item.VersionInfo.ProductVersion
          $expected = '${{ steps.tag.outputs.version }}'
          if (-not $stamped.StartsWith($expected)) {
            throw "Built exe reports version '$stamped', expected '$expected'."
          }

          $size = [Math]::Round($item.Length / 1MB, 1)
          Write-Host "MonitorScreenSaver.exe  $stamped  ($size MB)"
          "size=$size" >> $env:GITHUB_OUTPUT

      - name: Write SHA256SUMS.txt
        id: hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'publish/MonitorScreenSaver.exe' -Algorithm SHA256).Hash.ToLower()
          # Two spaces between hash and name is the format `sha256sum -c` expects, and the
          # line ending has to be LF: Set-Content would write CRLF here, and coreutils then
          # reads the trailing \r as part of the filename and reports "No such file".
          # WriteAllText also avoids a BOM, which breaks the first line the same way.
          $line = "$hash  MonitorScreenSaver.exe`n"
          [IO.File]::WriteAllText((Join-Path $PWD 'publish/SHA256SUMS.txt'), $line)
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      # Binds the exe's digest to this repo, this workflow and this commit, signed through
      # Sigstore. Anyone can then run `gh attestation verify` against their download.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: publish/MonitorScreenSaver.exe

      - name: Scan with VirusTotal
        id: vt
        if: env.VT_API_KEY != ''
        continue-on-error: true       # a VirusTotal outage should not block a release
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: publish/MonitorScreenSaver.exe
          # The release does not exist yet at this point, so the links are read back off
          # this step's output and written into the notes below instead.
          update_release_body: false

      # Built as an array of lines rather than a here-string: a PowerShell here-string
      # nested in a YAML block scalar has two sets of indentation rules fighting over the
      # same whitespace, and the closing "@ has to sit at column zero after YAML strips
      # the block indent. Not worth the trap for what is ultimately a list of lines.
      - name: Compose release notes
        shell: pwsh
        run: |
          $version = '${{ steps.tag.outputs.version }}'
          $sha     = '${{ steps.hash.outputs.sha256 }}'
          $size    = '${{ steps.build.outputs.size }}'
          $repo    = '${{ github.repository }}'
          $commit  = '${{ github.sha }}'
          $fence   = '```'
          $tick    = '`'

          # `analysis` arrives as asset=url pairs, comma separated.
          $vt = '${{ steps.vt.outputs.analysis }}'

          $lines = @(
            "Windows build of MonitorScreenSaver $version. Single file, self-contained, no"
            "installer and no .NET runtime needed. Drop it anywhere and run it."
            ""
            "## Verifying this download"
            ""
            "**SHA-256**"
            ""
            $fence
            "$sha  MonitorScreenSaver.exe"
            $fence
            ""
            "**Build provenance** - proves this exact binary was built by GitHub Actions"
            "from this repository, rather than uploaded from somebody's desktop:"
            ""
            $fence
            "gh attestation verify MonitorScreenSaver.exe -R $repo"
            $fence
            ""
          )

          if ($vt) {
            $lines += "**VirusTotal**"
            $lines += ""
            foreach ($pair in $vt -split ',') {
              $name, $url = $pair -split '=', 2
              # The action echoes back the path it was given, so this is the glob from
              # `files:` above, not a bare asset name. Label it the way it ships.
              $lines += "- [$tick$(Split-Path $name -Leaf)$tick]($url)"
            }
            $lines += ""
            $lines += "Expect a couple of heuristic flags. The exe is unsigned, it is a 150 MB"
            $lines += "self-extracting .NET bundle that unpacks native libraries into"
            $lines += "$tick%TEMP%\.net$tick at startup, and it writes a Run key for *Start at login*."
            $lines += "That combination reads as a dropper to a behavioural scanner. Every major"
            $lines += "engine should be clean."
          } else {
            $lines += "**VirusTotal** - no analysis for this release."
          }

          $lines += @(
            ""
            "## About the SmartScreen warning"
            ""
            "This build is **not code signed**, so Windows shows *""Windows protected your"
            "PC""* on first run - click **More info** then **Run anyway**. On Windows 11 with"
            "Smart App Control enabled it is blocked outright, and there is no way past that"
            "short of a signing certificate."
            ""
            "If you would rather not take the binary on trust, build it yourself. Needs the"
            ".NET 9 SDK and one command:"
            ""
            ($fence + 'powershell')
            "git clone https://github.com/$repo"
            "cd monitor-screensaver"
            ".\tools\publish.ps1"
            $fence
            ""
            "---"
            ""
            "${tick}MonitorScreenSaver.exe${tick} | $size MB | win-x64 | built from ${tick}${commit}${tick}"
          )

          ($lines -join "`n") | Set-Content 'publish/RELEASE_NOTES.md' -Encoding utf8

      - name: Publish the release
        shell: pwsh
        run: |
          $tag = '${{ steps.tag.outputs.tag }}'
          $title = "MonitorScreenSaver $($tag.Substring(1))"
          $assets = @('publish/MonitorScreenSaver.exe', 'publish/SHA256SUMS.txt')

          # Idempotent, so a re-run against the same tag updates instead of erroring.
          gh release view $tag > $null 2> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --title $title --notes-file 'publish/RELEASE_NOTES.md'
            gh release upload $tag $assets --clobber
          } else {
            gh release create $tag $assets --title $title --notes-file 'publish/RELEASE_NOTES.md'
          }
