# Builds every release artifact, publishes them, and attaches what a downloader needs to
# decide whether to trust them: a SHA-256, a GitHub build-provenance attestation, and a
# VirusTotal analysis link for the Windows binaries.
#
# None of this removes the SmartScreen warning - that needs a signing certificate, and an
# unsigned build starts from zero reputation on every release. What it buys is a way for a
# sceptical user to prove the binaries came out of the public source rather than off a
# maintainer's desktop.
#
#   Trigger:  git push origin v1.2.2     (or run it by hand against an existing tag)
#
# Artifacts:
#   MonitorScreenSaver.exe     ~1.4 MB   needs the .NET 9 Desktop Runtime
#   MonitorScreenSaverSC.exe   ~146 MB   runtime bundled
#   MonitorScreenSaver-<ver>-macos-arm64.dmg
#   MonitorScreenSaver-<ver>-macos-x64.dmg
#   SHA256SUMS.txt
#
# Optional secret:
#   VT_API_KEY  - a free VirusTotal API key. Absent, the scan is skipped and the release
#                 ships without analysis links; nothing else changes.
#
# Known limitation: the macOS disk images built here are unstyled. tools/make-dmg.sh writes
# the window layout by driving Finder over AppleScript, which needs a GUI session a hosted
# runner does not have; the script warns and carries on. The images install correctly, they
# just lack the background poster. Build them on a desktop Mac (tools/release-macos.sh) and
# re-upload if a styled image matters for a given release.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v1.2.2)'
        required: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- setup
  # The tag, both csprojs and the Windows manifest each carry the version independently and
  # nothing in the build reconciles them - that is how the manifest sat at 1.0.0.0 while the
  # csprojs had moved to 1.2.0. The mac csproj matters just as much now, because
  # bundle-macos.sh greps <Version> out of it to name the .dmg.
  setup:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.ref_name }}"
          fi
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Tag '$tag' is not of the form vMAJOR.MINOR.PATCH."; exit 1 ;;
          esac
          echo "tag=$tag"              >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}"      >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Check the version is consistent
        run: |
          expected="${{ steps.tag.outputs.version }}"
          read_version() { sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$1" | head -1; }

          win=$(read_version src/MonitorScreenSaver.Windows/MonitorScreenSaver.Windows.csproj)
          mac=$(read_version src/MonitorScreenSaver.Mac/MonitorScreenSaver.Mac.csproj)
          man=$(sed -n 's:.*<assemblyIdentity version="\([^"]*\)".*:\1:p' \
                    src/MonitorScreenSaver.Windows/app.manifest | head -1)

          # assemblyIdentity wants four parts; <Version> carries three.
          expected_manifest="$expected"
          while [ "$(echo "$expected_manifest" | tr -cd '.' | wc -c)" -lt 3 ]; do
            expected_manifest="$expected_manifest.0"
          done

          fail=0
          [ "$win" = "$expected" ] || { echo "::error::Windows csproj <Version> is '$win', tag says '$expected'"; fail=1; }
          [ "$mac" = "$expected" ] || { echo "::error::Mac csproj <Version> is '$mac', tag says '$expected'"; fail=1; }
          [ "$man" = "$expected_manifest" ] || { echo "::error::app.manifest assemblyIdentity is '$man', expected '$expected_manifest'"; fail=1; }
          [ "$fail" = "0" ] || exit 1

          echo "Version $expected agrees across tag, both csprojs and the manifest."

  # ---------------------------------------------------------------- windows
  windows:
    needs: setup
    runs-on: windows-latest
    env:
      # Normalises embedded paths in the build output. Free determinism, and it costs
      # nothing locally because it is only ever set here.
      ContinuousIntegrationBuild: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.tag }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Build both variants
        shell: pwsh
        run: .\tools\publish.ps1

      # publish.ps1 does not clean its output directory, so on a dirty tree an exe that
      # predates the build would otherwise sail through. A clean checkout cannot hit this,
      # but the check costs nothing and catches a bad local run of the same script.
      - name: Check the built exes
        shell: pwsh
        run: |
          $expected = '${{ needs.setup.outputs.version }}'
          foreach ($name in 'MonitorScreenSaver.exe', 'MonitorScreenSaverSC.exe') {
            $path = "publish/$name"
            if (-not (Test-Path $path)) { throw "$name was not produced." }
            $item = Get-Item $path
            $stamped = $item.VersionInfo.ProductVersion
            if (-not $stamped.StartsWith($expected)) {
              throw "$name reports version '$stamped', expected '$expected'."
            }
            "{0,-38} {1,8:N1} MB  {2}" -f $name, ($item.Length / 1MB), $stamped
          }

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: publish/MonitorScreenSaver*.exe
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------- macos
  macos:
    needs: setup
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.tag }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      # Builds x64 then arm64, producing one .dmg each. Ordering is deliberate in that
      # script for local builds; here it only matters that both get built.
      - name: Build both disk images
        run: |
          chmod +x tools/*.sh
          tools/release-macos.sh

      - name: Check the disk images
        run: |
          expected="${{ needs.setup.outputs.version }}"
          for arch in arm64 x64; do
            dmg="publish/MonitorScreenSaver-$expected-macos-$arch.dmg"
            [ -f "$dmg" ] || { echo "::error::$dmg was not produced."; exit 1; }
            printf '%-46s %s\n' "$(basename "$dmg")" "$(du -h "$dmg" | cut -f1)"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: publish/*.dmg
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------- release
  release:
    needs: [setup, windows, macos]
    runs-on: windows-latest
    permissions:
      contents: write         # create the release and upload its assets
      id-token: write         # mint the Sigstore OIDC token the attestation is signed with
      attestations: write     # record the attestation against the repo
      artifact-metadata: write
    env:
      # Read in a step-level `if:` below. A repo without the secret set gets an empty
      # string here and skips the scan rather than failing the release.
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: macos
          path: dist

      - name: Write SHA256SUMS.txt
        shell: pwsh
        run: |
          # Two spaces between hash and name is the format `sha256sum -c` expects, and the
          # line endings have to be LF: Set-Content would write CRLF, and coreutils then
          # reads the trailing \r as part of the filename and reports "No such file".
          # WriteAllText also avoids a BOM, which breaks the first line the same way.
          $lines = Get-ChildItem dist -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          [IO.File]::WriteAllText((Join-Path $PWD 'dist/SHA256SUMS.txt'), ($lines -join "`n") + "`n")
          Get-Content dist/SHA256SUMS.txt

      # Binds each artifact's digest to this repo, this workflow and this commit, signed
      # through Sigstore. Anyone can then run `gh attestation verify` on their download.
      # Done here rather than in the build jobs so the attested bytes are provably the same
      # bytes that get uploaded to the release.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/MonitorScreenSaver.exe
            dist/MonitorScreenSaverSC.exe
            dist/*.dmg

      - name: Scan with VirusTotal
        id: vt
        if: env.VT_API_KEY != ''
        continue-on-error: true       # a VirusTotal outage should not block a release
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          # Windows binaries only. The .dmg files face Gatekeeper, not Defender, and the
          # public API allows 4 requests a minute - two uploads plus their overhead fits.
          files: |
            dist/MonitorScreenSaver.exe
            dist/MonitorScreenSaverSC.exe
          request_rate: 4
          # The release does not exist yet, so links are read off this step's output and
          # written into the notes below instead.
          update_release_body: false

      # Built as an array of lines rather than a here-string: a PowerShell here-string
      # nested in a YAML block scalar has two sets of indentation rules fighting over the
      # same whitespace. Everything here is ASCII on purpose - the runner writes this block
      # to a script file, and a mangled em dash terminates a string and breaks the parse.
      - name: Compose release notes
        shell: pwsh
        run: |
          $version = '${{ needs.setup.outputs.version }}'
          $repo    = '${{ github.repository }}'
          $commit  = '${{ github.sha }}'
          $fence   = '```'
          $tick    = '`'
          $runtime = 'https://aka.ms/dotnet/9.0/windowsdesktop-runtime-win-x64.exe'

          function Size($name) {
            $f = Get-Item "dist/$name" -ErrorAction SilentlyContinue
            if ($f) { "{0:N1} MB" -f ($f.Length / 1MB) } else { "?" }
          }

          $lines = @(
            "MonitorScreenSaver $version."
            ""
            "## Windows"
            ""
            "| Download | Size | |"
            "|---|---|---|"
            "| ${tick}MonitorScreenSaver.exe${tick} | $(Size 'MonitorScreenSaver.exe') | **Start here.** Needs the .NET 9 Desktop Runtime |"
            "| ${tick}MonitorScreenSaverSC.exe${tick} | $(Size 'MonitorScreenSaverSC.exe') | Runtime built in. For machines you cannot install software on |"
            ""
            "Both are the same app. The small one is 100x smaller because it uses the .NET"
            "runtime already on your PC instead of carrying its own copy."
            ""
            "**Don't have the runtime?** Most PCs don't yet."
            ""
            "[**Download the .NET 9 Desktop Runtime**]($runtime) - 58 MB, one click, about a minute."
            ""
            "Prefer a terminal? ${tick}winget install --id Microsoft.DotNet.DesktopRuntime.9 -e${tick}"
            ""
            "If you skip this and run ${tick}MonitorScreenSaver.exe${tick} anyway, Windows tells you the"
            "runtime is missing - nothing breaks, you just come back here."
            ""
            "## macOS"
            ""
          )

          $dmgs = Get-ChildItem dist -Filter *.dmg | Sort-Object Name
          foreach ($d in $dmgs) {
            $which = if ($d.Name -match 'arm64') { 'Apple silicon (M1 and later)' } else { 'Intel' }
            $lines += "- ${tick}$($d.Name)${tick} - $which, $("{0:N1} MB" -f ($d.Length / 1MB))"
          }
          $lines += @(
            ""
            "Drag the app onto Applications in the Finder, then see the README for the"
            "Gatekeeper step - these builds are ad-hoc signed, not notarized, so the first"
            "launch is refused until you allow it in System Settings > Privacy & Security."
            ""
            "Note: these disk images were built on a CI runner and have no background art."
            "They install exactly the same way."
            ""
            "## Verifying these downloads"
            ""
            "Every file's SHA-256 is in ${tick}SHA256SUMS.txt${tick}:"
            ""
            ($fence + 'bash')
            "sha256sum -c SHA256SUMS.txt"
            $fence
            ""
            "**Build provenance** - proves these exact files were built by GitHub Actions"
            "from this repository, rather than uploaded from somebody's desktop:"
            ""
            $fence
            "gh attestation verify MonitorScreenSaver.exe -R $repo"
            $fence
            ""
          )

          $vt = '${{ steps.vt.outputs.analysis }}'
          if ($vt) {
            $lines += "**VirusTotal**"
            $lines += ""
            foreach ($pair in $vt -split ',') {
              $name, $url = $pair -split '=', 2
              # The action echoes back the path it was given, not a bare asset name.
              $lines += "- [$tick$(Split-Path $name -Leaf)$tick]($url)"
            }
            $lines += ""
            $lines += "A heuristic flag or two on the self-contained build is expected: it is a"
            $lines += "146 MB unsigned binary that unpacks native libraries into ${tick}%TEMP%\.net${tick} at"
            $lines += "startup, which reads as a dropper to a behavioural scanner. The small build"
            $lines += "carries no runtime and is usually clean."
          } else {
            $lines += "**VirusTotal** - no analysis for this release."
          }

          $lines += @(
            ""
            "## About the SmartScreen warning"
            ""
            "These builds are **not code signed**, so Windows shows *""Windows protected your"
            "PC""* on first run - click **More info** then **Run anyway**. On Windows 11 with"
            "Smart App Control enabled it is blocked outright, and there is no way past that"
            "short of a signing certificate."
            ""
            "Rather not take a binary on trust? Build it yourself - .NET 9 SDK, one command:"
            ""
            ($fence + 'powershell')
            "git clone https://github.com/$repo"
            "cd monitor-screensaver"
            ".\tools\publish.ps1"
            $fence
            ""
            "---"
            ""
            "Built from ${tick}${commit}${tick}"
          )

          ($lines -join "`n") | Set-Content 'RELEASE_NOTES.md' -Encoding utf8

      - name: Publish the release
        shell: pwsh
        run: |
          $tag = '${{ needs.setup.outputs.tag }}'
          $title = "MonitorScreenSaver $($tag.Substring(1))"
          $assets = (Get-ChildItem dist -File | Sort-Object Name).FullName

          # This job only downloads artifacts, it never checks out the source, so there is
          # no git remote for gh to infer the repository from -- without --repo every call
          # here dies with "fatal: not a git repository". Naming it explicitly is cheaper
          # than checking out a repo whose contents this job does not need.
          $repo = '${{ github.repository }}'

          Write-Host "Uploading to ${repo}:"
          $assets | ForEach-Object { Write-Host "  $(Split-Path $_ -Leaf)" }

          # Idempotent, so a re-run against the same tag updates instead of erroring.
          gh release view $tag --repo $repo > $null 2> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --repo $repo --title $title --notes-file 'RELEASE_NOTES.md'
            gh release upload $tag $assets --repo $repo --clobber
          } else {
            gh release create $tag $assets --repo $repo --title $title --notes-file 'RELEASE_NOTES.md'
          }
